# ============================================================
# Habitax - Spring Boot configuration
# ============================================================
# Comportamiento automático:
#
# - Si hay variables de entorno (SPRING_DATASOURCE_URL, etc.)
#   -> la app usa MySQL RDS (producción, o desarrollo con source ~/habitax-env.sh)
#
# - Si NO hay variables de entorno
#   -> la app usa H2 en memoria, creando las tablas automáticamente.
#   -> Ideal para desarrollo: clonar repo + ejecutar en IDE = funciona.
#
# En producción (Elastic Beanstalk) la variable JPA_DDL_AUTO=validate
# garantiza que Hibernate NO modifica el esquema real de RDS.
# ============================================================

spring.application.name=predictor
server.port=${SERVER_PORT:8081}

# ------------------------------------------------------------
# Datasource
# Los valores por defecto (después de ':') aplican solo si la variable
# correspondiente no está definida en el entorno.
# ------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:habitax;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# ------------------------------------------------------------
# JPA / Hibernate
# - Por defecto 'create': ideal para H2 local (crea tablas al arrancar).
# - En EB está JPA_DDL_AUTO=validate, que protege el esquema real.
# ------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:create}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ------------------------------------------------------------
# Pool de conexiones (HikariCP)
# ------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ------------------------------------------------------------
# API externa (RapidAPI - Idealista)
# CORRECCIÓN AUDITORÍA 2.1: Credenciales externalizadas al 100%.
# No contienen valores de fallback (hardcoded) en el código fuente.
# ------------------------------------------------------------
rapidapi.key=${RAPIDAPI_KEY:}
rapidapi.host=${RAPIDAPI_HOST:idealista7.p.rapidapi.com}

# ------------------------------------------------------------
# Consola H2 (Seguridad optimizada)
# CORRECCIÓN AUDITORÍA 2.2: Desactivada por defecto para producción.
# En desarrollo local se activa externamente mediante el launch.json de VS Code.
# ------------------------------------------------------------
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/habitax-db-panel

# ------------------------------------------------------------
# Actuator health (Elastic Beanstalk lo usa para health checks)
# ------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Desactivar por completo la seguridad por defecto de Spring Security
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

#para subir .env

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=1MB